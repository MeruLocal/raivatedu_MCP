name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Live smoke tests stay skipped (no RUN_SMOKE), so CI never hits raivatedu.com.
      - run: npm test
      - run: npm run check:versions
      # Shipped dependencies only; the dev toolchain (vitest 2.x) has known
      # advisories that need a major upgrade (tracked separately).
      - run: npm audit --omit=dev --audit-level=high
